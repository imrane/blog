name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --impure

      - name: Build package
        run: nix build .#blog

      - name: Smoke test packaged app
        run: |
          set -euo pipefail
          APP_BIN="$(readlink -f ./result/bin/blog)"
          HOST=127.0.0.1 PORT=3000 SKIP_VIEWS=1 SKIP_TWEET_FETCH=1 "$APP_BIN" > /tmp/blog.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 90); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "App process exited before health check passed"
              cat /tmp/blog.log || true
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:3000/api/health" > /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS "http://127.0.0.1:3000/api/health" | tee /tmp/health.json; then
            echo "Health check failed after waiting"
            cat /tmp/blog.log || true
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json

          curl -fsS "http://127.0.0.1:3000/api/posts" | tee /tmp/posts.json
          grep -q '"id"' /tmp/posts.json
