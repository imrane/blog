name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --impure

      - name: Build package
        run: nix build .#blog

      - name: Smoke test packaged app (Redis auth + DB)
        run: |
          set -euo pipefail
          APP_BIN="$(readlink -f ./result/bin/blog)"
          docker rm -f blog-redis-ci 2>/dev/null || true
          docker run -d --name blog-redis-ci -p 6379:6379 \
            redis:7-alpine redis-server --requirepass super-secret
          HOST=127.0.0.1 PORT=3000 REDIS_URL=redis://default:super-secret@127.0.0.1:6379/1 SKIP_TWEET_FETCH=1 "$APP_BIN" > /tmp/blog.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; docker rm -f blog-redis-ci 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if docker exec blog-redis-ci redis-cli -a super-secret ping 2>/dev/null | grep -q PONG; then
              break
            fi
            sleep 1
          done

          for i in $(seq 1 90); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "App process exited before health check passed"
              cat /tmp/blog.log || true
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:3000/api/health" > /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS "http://127.0.0.1:3000/api/health" | tee /tmp/health.json; then
            echo "Health check failed after waiting"
            cat /tmp/blog.log || true
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health.json

          curl -fsS "http://127.0.0.1:3000/api/posts" | tee /tmp/posts.json
          grep -q '"id"' /tmp/posts.json

          curl -fsS "http://127.0.0.1:3000/api/view?id=hello-world&incr=1" | tee /tmp/view1.json
          grep -q '"views":1' /tmp/view1.json

          curl -fsS "http://127.0.0.1:3000/api/view?id=hello-world&incr=1" | tee /tmp/view2.json
          grep -q '"views":2' /tmp/view2.json

      - name: Build OCI image
        run: nix build .#blog-image

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Smoke test OCI image (Podman)
        run: |
          set -euo pipefail
          podman load < result
          podman rm -f blog-ci 2>/dev/null || true
          trap 'podman rm -f blog-ci 2>/dev/null || true' EXIT
          podman run -d --name blog-ci -p 3000:3000 \
            -e SKIP_VIEWS=1 \
            -e SKIP_TWEET_FETCH=1 \
            imrane-blog:latest

          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:3000/api/health" > /tmp/health-container.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS "http://127.0.0.1:3000/api/health" | tee /tmp/health-container.json; then
            echo "Container health check failed after waiting"
            podman logs blog-ci || true
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/health-container.json

          curl -fsS "http://127.0.0.1:3000/api/posts" | tee /tmp/posts-container.json
          grep -q '"id"' /tmp/posts-container.json
